<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WCB Medical &amp; Travel Expense Request</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Toolbar for selecting data and printing -->
  <div class="toolbar">
    <span class="toolbar__title">WCB Expense Request</span>

    <label for="dataset-select">Datasets:</label>
    <select id="dataset-select"></select>

    <button id="print-btn" type="button">Print / Save as PDF</button>

    <span id="status"></span>
  </div>

  <!-- Main content area where the form is rendered -->
  <div class="document-wrapper">
    <div id="app"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pug-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
